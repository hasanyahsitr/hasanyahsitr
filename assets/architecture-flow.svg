<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#121720" />
    </linearGradient>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      .wire-flow {
        stroke-dasharray: 8 8;
        animation: dashFlow 1.8s linear infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="290" rx="20" fill="url(#archBg)" stroke="#262f3d" stroke-width="1.5" />

  <text x="34" y="36" fill="#d6c39f" font-size="11" font-weight="800" letter-spacing="2" class="font-mono">
