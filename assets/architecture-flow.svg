  </circle>
  <circle r="4" fill="#84a59d">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 552 205 C 585 205, 595 155, 628 155" />
  </circle>
  <circle r="4.5" fill="#cbd5e1">
