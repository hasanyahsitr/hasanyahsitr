  </circle>
  <circle r="4" fill="#a69f98">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 248 155 C 275 155, 285 205, 312 205" />
  </circle>
  <circle r="4" fill="#d6c39f">
