    <path id="wire2" d="M 248 155 C 275 155, 285 205, 312 205" stroke="#a69f98" class="wire-flow" />
    <path id="wire3" d="M 552 110 C 585 110, 595 155, 628 155" stroke="#d6c39f" class="wire-flow" />
    <path id="wire4" d="M 552 205 C 585 205, 595 155, 628 155" stroke="#84a59d" class="wire-flow" />
    <path id="wire5" d="M 868 155 L 932 155" stroke="#cbd5e1" class="wire-flow" />
  </g>

  <circle r="4" fill="#8da2b5">
